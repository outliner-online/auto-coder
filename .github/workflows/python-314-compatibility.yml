name: Python 3.14 Compatibility (Advisory)

'on':
  pull_request:
    paths:
      - '.github/workflows/python-314-compatibility.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'tests/test_ci_uv_lock_policy.py'
      - 'tests/test_python314_orchestration.py'
      - 'scripts/plan_python314_tests.py'
      - 'scripts/plan_ci_shards.py'
      - 'scripts/ci_shard_plugin.py'
      - 'src/auto_coder/ci_shard_plan.py'
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON: "3.14"
  AUTO_CODER_REQUIRE_BROWSER: "1"
  AUTO_CODER_IMMEDIATE_TEST_FAILURES: "1"
  PYTEST_ADDOPTS: "-o faulthandler_timeout=60 -o faulthandler_exit_on_timeout=false"

jobs:
  python314-plan:
    name: Python 3.14 source quality and complete test plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      artifact: ${{ steps.plan.outputs.artifact }}
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select supported uv release
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"
      - name: Install production Python for isolated runtime fixtures
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Select advisory Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Admit unchanged locked dependencies
        run: uv sync --locked --dev --extra test
      - name: Verify selected interpreter and source identity
        run: |
          uv run python -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
          uv run python -c 'from auto_coder.build_identity import resolve_build_identity; r=resolve_build_identity("."); assert r.state == "clean" and r.source_revision == "${{ github.event.pull_request.head.sha || github.sha }}"'
      - name: Check source quality on Python 3.14
        run: |
          uv run black --check src/ tests/
          uv run isort --check-only src/ tests/
          uv run flake8 src/ tests/
          uv run mypy --config-file pyproject.toml -p auto_coder
      - name: Collect complete non-live inventory and immutable assignments
        id: plan
        run: >-
          uv run python -m scripts.plan_python314_tests
          --source-sha '${{ github.event.pull_request.head.sha || github.sha }}'
          --directory "$RUNNER_TEMP/python314-plan"
          --github-output "$GITHUB_OUTPUT"
      - name: Retain current-attempt plan and collection diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python314-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/python314-plan/
          if-no-files-found: warn

  python314-shard:
    name: Python 3.14 non-live tests (${{ matrix.shard }}/${{ needs.python314-plan.outputs.count }})
    needs: [python314-plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.python314-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/auto-coder-python314-playwright-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
      AUTO_CODER_CI_TIMING_INVOCATION: python314-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select supported uv release
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.7.22"
      - name: Install production Python for isolated runtime fixtures
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Select advisory Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Admit unchanged locked dependencies
        run: uv sync --locked --dev --extra test
      - name: Verify selected interpreter and source identity
        run: |
          uv run python -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
          uv run python -c 'from auto_coder.build_identity import resolve_build_identity; r=resolve_build_identity("."); assert r.state == "clean" and r.source_revision == "${{ github.event.pull_request.head.sha || github.sha }}"'
      - name: Download authoritative successful planner assignments
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.python314-plan.outputs.artifact }}
          path: ${{ runner.temp }}/python314-plan
      - name: Verify authoritative successful planner binding
        run: >-
          uv run python -m scripts.plan_python314_tests
          --source-sha '${{ github.event.pull_request.head.sha || github.sha }}'
          --verify-plan "$RUNNER_TEMP/python314-plan/plan.json"
          --planner-result '${{ needs.python314-plan.result }}'
          --planner-artifact '${{ needs.python314-plan.outputs.artifact }}'
          --planner-digest '${{ needs.python314-plan.outputs.digest }}'
      - name: Prepare required Python-only management fixture
        run: uv run python scripts/prepare_management_test_image.py
      - name: Install real Chromium
        run: uv run playwright install --with-deps chromium
      - name: Verify real headless Chromium
        run: uv run python scripts/browser_preflight.py
      - name: Run complete non-live test selection
        env:
          AUTO_CODER_CI_TIMING_DIR: ${{ runner.temp }}/python314-shard/timing
        run: >-
          uv run python -m pytest -p scripts.ci_shard_plugin
          --ci-plan="$RUNNER_TEMP/python314-plan/plan.json"
          --ci-shard=${{ matrix.shard }}
          -m 'not opencode_live' -vv
          --junitxml "$RUNNER_TEMP/python314-shard/results.xml"
      - name: Summarize native phase timing
        if: always()
        continue-on-error: true
        run: uv run python scripts/summarize_ci_timing.py "$RUNNER_TEMP/python314-shard/timing" --output "$RUNNER_TEMP/python314-shard/timing/summary.json"
      - name: Retain current-attempt test results and timing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python314-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/python314-shard/
          if-no-files-found: warn

  python314-compatibility:
    name: Python 3.14 source quality and non-live tests (advisory)
    if: always()
    needs: [python314-plan, python314-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful quality, complete planning and every native test shard
        env:
          PLAN_RESULT: ${{ needs.python314-plan.result }}
          SHARDS_RESULT: ${{ needs.python314-shard.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$SHARDS_RESULT" = success
