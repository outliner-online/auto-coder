tests:
- vars:
    id: fixed-original-oracle-converges
    title: Original production-boundary oracle is now protected
    requirement: ReviewController.validate must enforce the authorization guard, and committed regression coverage must exercise
      that production boundary.
    prior_gap_status: OPEN
    prior_resolution_evidence: ''
    scope_context: 'The fixed Objective is to preserve authorization validation. REQ-001 is the sole implementation contract.

      '
    current_evidence: 'The current patch retains the authorization guard and adds a committed regression that enters through
      ReviewController.validate, attempts an unauthorized operation, and proves rejection and unchanged durable state.

      '
    review_demand: (No claimed-addressed review threads for this run.)
  assert:
  - type: javascript
    value: ((r)=>{const gaps=r.test_oracle_gaps||[]; return r.result==='PASS' && (r.findings||[]).length===0 && gaps.length===1
      && gaps[0].gap_id==='TOG-original-oracle' && gaps[0].status==='RESOLVED' && Boolean(gaps[0].resolution_evidence);})(JSON.parse(output))
- vars:
    id: unrelated-variant-and-parent-demand-are-not-blockers
    title: Unrelated reviewer expansion after the original oracle was fixed
    requirement: ReviewController.validate must enforce the authorization guard, and committed regression coverage must exercise
      that production boundary.
    prior_gap_status: RESOLVED
    prior_resolution_evidence: tests/test_review_controller.py exercises the exact production authorization boundary and proves
      rejection with unchanged state.
    scope_context: 'The fixed Objective is to preserve authorization validation. REQ-001 is the sole implementation contract.
      A parent tracking issue mentions a future audit-export feature only as coordination context.

      '
    current_evidence: 'The authorization guard and its exact production-boundary regression are unchanged. This correction
      does not touch audit export or alternate batch variants, and current evidence shows no violation of REQ-001.

      '
    review_demand: 'A reviewer suggests additionally testing an unrelated batch variant and implementing the parent issue''s
      future audit-export feature.

      '
  assert:
  - type: javascript
    value: ((r)=>{const blocking=(r.test_oracle_gaps||[]).filter(g=>g.status==='OPEN'); return r.result==='PASS' && (r.findings||[]).length===0
      && blocking.length===0;})(JSON.parse(output))
- vars:
    id: correction-induced-material-defect-blocks
    title: Corrective diff removes the required production guard
    requirement: ReviewController.validate must enforce the authorization guard, and committed regression coverage must exercise
      that production boundary.
    prior_gap_status: RESOLVED
    prior_resolution_evidence: tests/test_review_controller.py previously exercised the exact production authorization boundary.
    scope_context: 'The fixed Objective is to preserve authorization validation. REQ-001 is the sole implementation contract.

      '
    current_evidence: 'The corrective diff deletes the authorization check from ReviewController.validate. An unauthorized
      caller now reaches the durable mutation and changes state. The changed test replaces the unauthorized production-boundary
      case with an authorized happy-path assertion, so it remains green while this exact REQ-001 behavior is violated.

      '
    review_demand: (No claimed-addressed review threads for this run.)
  assert:
  - type: javascript
    value: ((r)=>{const findings=r.findings||[]; return r.result==='NEEDS_FIX' && findings.length>0 && findings.some(f=>(f.requirement_ids||[f.requirement_id]).some(id=>id==='REQ-001'||id.endsWith('/REQ-001'))
      && /authorization|unauthorized/i.test(JSON.stringify(f)));})(JSON.parse(output))
- vars:
    id: local-required-regression-fix-retains-input-head-finding
    title: Reviewer adds the missing required regression and its local check passes
    requirement: ReviewController.validate must enforce the authorization guard, and committed regression coverage must exercise
      that production boundary.
    prior_gap_status: OPEN
    prior_resolution_evidence: ''
    scope_context: 'The fixed Objective is to preserve authorization validation. REQ-001 is the sole implementation contract.
      The review response assesses the admitted input HEAD, even if the reviewer has made an eligible local correction.'
    current_evidence: 'At the admitted input HEAD, ReviewController.validate correctly rejects unauthorized operations, but
      tests/test_review_controller.py contains only an authorized happy-path assertion. No committed regression exercises
      unauthorized entry through ReviewController.validate or proves unchanged durable state. This violates the explicit
      required regression deliverable, not the current runtime guard. Before editing, the reviewer established this missing
      deliverable. The reviewer then added the focused unauthorized production-boundary regression in the private workspace
      and ran it successfully. That new test is an uncommitted post-edit correction, absent from the admitted input HEAD.'
    review_demand: 'The local focused test is now green. Return the required structured review response for the admitted
      input HEAD; preserve the original missing-regression obligation without creating a duplicate gap lifecycle.'
  assert:
  - type: javascript
    value: ((r)=>{const findings=r.findings||[]; const coverage=r.requirement_coverage||[]; return r.result==='NEEDS_FIX'
      && findings.some(f=>(f.requirement_ids||[f.requirement_id]).some(id=>id==='REQ-001'||id.endsWith('/REQ-001'))
      && /regression|test/i.test(JSON.stringify(f))) && coverage.some(c=>(c.requirement_id==='REQ-001'||c.requirement_id.endsWith('/REQ-001'))
      && c.status==='VIOLATED');})(JSON.parse(output))
